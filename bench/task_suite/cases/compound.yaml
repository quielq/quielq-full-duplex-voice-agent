# Compound requests: one sentence, two tools. Run with --all-servers. A reply template must
# never cost the second tool (ADR-020). See clock.yaml for the format.
server: lights
cases:
  - id: compound_lights_and_timer
    layer: tool_call
    live_only: true
    turns: ["turn off the kitchen light and set a timer for ten minutes"]
    expect:
      tools_include: [set_light, set_timer]

  - id: compound_note_and_timer
    layer: tool_call
    live_only: true
    turns: ["add a note to buy milk and set a timer for five minutes"]
    expect:
      tools_include: [add_note, set_timer]

  - id: compound_music_and_lights
    layer: tool_call
    live_only: true
    turns: ["play some jazz and dim the bedroom light to 20 percent"]
    expect:
      tools_include: [play_music, set_light]

  - id: compound_thermostat_then_lights
    layer: tool_call
    live_only: true
    turns: ["set the thermostat to 22 degrees, then turn on the kitchen light"]
    expect:
      tools_include: [set_thermostat, set_light]

  - id: compound_two_lights
    layer: tool_call
    live_only: true
    turns: ["turn on the kitchen light and the bedroom light"]
    expect:
      tools_include: [set_light]

  - id: compound_no_joiner
    layer: tool_call
    live_only: true
    turns: ["set a timer for two minutes. Also stop the music."]
    expect:
      tools_include: [set_timer, stop_music]
