# Workspace task cases. bash is a mock here, and the state check proves nothing ran.
server: workspace
cases:
  - id: workspace_args_read
    layer: tool_call
    seed: {workspace: [{path: plan.md, text: "ship friday"}]}
    turns: ["read the file plan.md"]
    expect:
      tools: [read_file]
      args: {read_file: {path: plan.md}}

  - id: workspace_list_files_runs_at_once
    layer: tool_call
    seed: {workspace: [{path: plan.md, text: "ship friday"}]}
    turns: ["what files can you see"]
    expect: {tools: [list_files]}

  - id: workspace_args_grep
    layer: tool_call
    seed: {workspace: [{path: plan.md, text: "ship friday"}]}
    turns: ["grep for friday"]
    expect: {tools: [grep]}

  - id: workspace_write_runs_at_once
    layer: tool_call
    turns: ["write hello to hello.txt"]
    expect:
      tools: [write_file]
      state: {workspace: {count: 1, has: [{path: hello.txt, text: hello}]}}

  - id: workspace_rewrite_replaces_the_file
    layer: tool_call
    seed: {workspace: [{path: keep.txt, text: old}]}
    turns: ["write hello to keep.txt"]
    expect:
      tools: [write_file]
      state: {workspace: {count: 1, has: [{path: keep.txt, text: hello}]}}

  - id: workspace_plan_and_build_a_site
    layer: tool_call
    live_only: true
    # The pause outlasts the opening sentence, which would otherwise end the run (ADR-028).
    turns: ["plan and build a small website about red pandas, with a home page and a stylesheet", 45]
    expect:
      tools_include: [write_file, read_file]

  - id: workspace_bash_waits_for_yes
    layer: tool_call
    turns: ["run the command ls"]
    expect:
      tools: [bash]
      state: {mock_commands: {count: 0}}

  - id: workspace_conv_bash_yes_runs_mock
    layer: conversation
    undo_s: 0.1
    turns: ["run the command ls", "yes"]
    expect:
      tools: [bash]
      state: {mock_commands: {count: 1, has: [{command: ls}]}}

  - id: workspace_conv_bash_no_stops
    layer: conversation
    turns: ["run the command ls", "no"]
    expect:
      tools: [bash]
      state: {mock_commands: {count: 0}}

  - id: workspace_open_in_browser_waits_for_yes
    layer: tool_call
    seed: {workspace: [{path: page.html, text: "<h1>hi</h1>"}]}
    turns: ["open page.html in the browser"]
    expect:
      tools: [open_in_browser]
      spoken_re: "Open page.html in your browser"
