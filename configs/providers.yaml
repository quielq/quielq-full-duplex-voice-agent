# Which implementation each stage uses, and what each provider may spend.
#
# Every stage defaults to "fake", which costs nothing and needs no key.
# Switch per run without editing this file: python -m harness.bot --stages stt=deepgram_flux,llm=groq
# A real provider runs only when (1) a stage selects it, (2) its key is in .env,
# and (3) its daily cap is above zero. A cap of zero means every call is refused.
# Caps are in USD at list price, so free-tier usage still counts against them.

stages:
  stt: fake   # fake | deepgram_flux
  llm: fake   # fake | groq | anthropic
  tts: fake   # fake | fake_words (fake with word timestamps) | deepgram_aura2 | cartesia

providers:
  deepgram:
    env_key: DEEPGRAM_API_KEY
    daily_cap_usd: 0.50   # approved Oct 21, 2026; free credit, list price
    stt_model: flux-general-en
    flux:                        # null keeps Deepgram's default; override per run with --flux
      eot_threshold: null        # 0.5 to 1.0, default 0.7
      eager_eot_threshold: null  # 0.3 to 0.9, unset leaves eager end of turn off
      eot_timeout_ms: null       # 500 to 60000, default 5000
    tts_voice: aura-2-thalia-en
    tts_sample_rate: 16000   # 24000 arrives slower than real time on this link (ADR-014)
  groq:
    env_key: GROQ_API_KEY
    daily_cap_usd: 0.50   # approved Oct 21, 2026; free tier, list price
    model: openai/gpt-oss-20b
  cartesia:
    env_key: CARTESIA_API_KEY
    daily_cap_usd: 0.10   # approved Oct 31, 2026, for the delivery comparison
    voice_id: db6b0ed5-d5d3-463d-ae85-518a07d3c2b4   # Skylar, public voice
    tts_sample_rate: 24000   # matches the output, so nothing resamples
  anthropic:
    env_key: ANTHROPIC_API_KEY
    daily_cap_usd: 0.0
    model: claude-haiku-5-5
  openrouter:
    env_key: OPENROUTER_API_KEY
    daily_cap_usd: 0.0

# List prices used by the cost ledger (USD). Recheck on the day a provider is switched on.
# Sources: docs/architecture.md, "Cost and budget" and "Model comparison under $20".
prices:
  deepgram_flux_per_min: 0.0077        # regular rate; promo is 0.0065
  deepgram_aura2_per_char: 0.000030    # $0.030 per 1,000 characters
  cartesia_per_char: 0.000050          # about $50 per 1M characters on Pro
  groq:
    input_per_token: 0.000000075       # gpt-oss-20b, $0.075 per 1M
    output_per_token: 0.00000030       # $0.30 per 1M
    by_model:
      openai/gpt-oss-120b:             # trackers, Oct 2026; launch post said $0.75 output. Recheck on console.groq.com/pricing
        input_per_token: 0.00000015    # $0.15 per 1M
        output_per_token: 0.00000060   # $0.60 per 1M
  anthropic:
    input_per_token: 0.00000010        # Haiku 5.5, $0.10 per 1M
    output_per_token: 0.00000050       # $0.50 per 1M
