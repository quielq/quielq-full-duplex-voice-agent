# Per-tool policy, enforced by the harness (harness/tool_policy.py, ADR-009, ADR-010).
# MCP hints are only hints: this file and the rules in tool_policy.py decide what runs.
#
# Defaults from hints, when a tool has no entry under `tools`:
#   read only, or a write that is not destructive    run at once
#   destructive, closed world (cancel_timer)         run after the undo window
#   destructive, open world (calls, messages)        spoken confirmation, then the undo window
#   hints missing                                    spoken confirmation

defaults:
  undo_s: 5.0            # destructive tools wait this long; "cancel" stops them
  timeout_s: 10.0        # for the tool call itself, never counting the undo or confirm wait
  confirm_wait_s: 20.0   # no answer this long after the question has played means no
  announce_wait_s: 30.0  # the undo window opens once the user has heard about it; if that never happens, drop it

# Words matched on interim and final transcripts while something is held.
undo_words: ["cancel", "stop", "undo", "wait", "no", "pause"]   # quoted: bare no is a YAML boolean
yes_words: ["yes", "yeah", "yep", "sure", "okay", "ok", "confirm", "go ahead", "do it"]
no_words: ["no", "nope", "cancel", "stop", "don't", "do not", "never mind"]

# A held-action answer of this many words or fewer is consumed by the harness. A longer one
# ("cancel that and set a new timer") still acts on the hold, then reaches the LLM as usual.
answer_max_words: 3
yes_max_words: 6   # a longer reply with "okay" in it is not a yes

# A confirm tool with a `readback` is asked about by the harness, from its real arguments, with
# no LLM call (ADR-024). Text longer than this is refused, since it cannot be heard in full.
readback_max_chars: 240

# After this many critical refusals in a session something is steering the model, so these
# tools refuse every call until the session ends (ADR-024).
containment:
  after_critical: 3
  tools: [bash, serve, write_file, edit_file, send_file, open_in_browser, send_message, call_contact, start_task]

# Fixed phrases: spoken by the harness with no LLM call.
phrases:
  undone: "Okay, I stopped that. Nothing changed."
  denied: "Okay, I won't do that."
  confirmed_undo: "Okay. Say cancel in the next {undo_s} seconds to stop it."
  confirmed_now: "Okay, doing that now."
  failed: "Sorry, that did not go through."
  unlisted: "Careful, this uses {what}, which is not on my list of known programs."
  contained: "I've been asked to do several unsafe things, so I've locked my shell and messaging until this session ends."

# Spoken instead of a second LLM call when the tool succeeds (ADR-020). Off by default. Fields
# come from the call's arguments and the result, plus spoken_duration and on_off. Held tools
# never use these. The model calls tools one at a time, so a request that may need another
# tool keeps the LLM: any word below, or punctuation inside the sentence.
reply_templates:
  enabled: false
  compound_words: ["and", "then", "also", "plus", "after", "before", "all", "every", "both", "everything", "lights"]
  templates:
    get_time: "It's {spoken_time}."
    get_weather: "It's {summary}."   # a forecast has no summary, so it keeps the LLM
    set_timer: "Timer set for {spoken_duration}."
    add_note: "Noted."
    set_thermostat: "Thermostat set to {target_c:g} degrees."
    set_light: "The {room} light is {on_off}."
    play_music: "Playing {now_playing}."
    stop_music: "Music paused."
    resume_music: "Resuming {now_playing}."
    next_track: "Playing {now_playing}."
    previous_track: "Playing {now_playing}."
    restart_track: "Starting {now_playing} again."

# Overrides. Keys: permission (auto | confirm | disabled), undo_s, timeout_s, report_result, readback, guard.
# readback: fields are the call's arguments, plus command_words (the command in plain words,
# from servers/command_policy.py), command_clause (the same as ", which will ..."), and command_spoken.
# guard: a check in harness/tool_policy.py GUARDS, run before anyone is asked.
# report_result: true by default. A held tool's success gets one more LLM reply (ADR-023).
tools:
  cancel_timer:
    permission: auto
    undo_s: 5.0
  # The worker can do only what needs no yes, so starting one runs at once (ADR-035).
  start_task: {permission: auto}
  cancel_task:
    permission: auto
    undo_s: 5.0
  search: {timeout_s: 15.0}
  fetch_content: {timeout_s: 20.0}
  get_weather: {timeout_s: 15.0}
  index_documents: {timeout_s: 60.0}
  # Confined to the workspace, and the server keeps the old version, so a multi-step job can
  # write a file and use it on the next step (ADR-028).
  write_file: {permission: auto, undo_s: 0}
  edit_file: {permission: auto, undo_s: 0}
  send_message:
    timeout_s: 25.0   # the bridge can take 22 s
    readback: "Send {to} this message: {body}. Should I send it?"
  call_contact:
    timeout_s: 25.0
    readback: "Call {to}. Should I call?"
  bash:
    timeout_s: 30.0   # the server stops the command at 25 s; longer work goes through serve
    guard: command    # reads run at once; changes and runs ask (ADR-034)
    readback: "This will {command_words}. Should I go ahead?"
  open_in_browser:
    readback: "Open {path} in your browser. Should I do that?"
  serve:
    timeout_s: 15.0
    guard: service
    readback: "{action} the service {name}{command_clause}. Should I do that?"
