# Phase 1 profile: MacBook Air with headphones.
# A profile sets audio devices, sample rates, and timing knobs. Nothing else may differ from pi.yaml.

profile: mac

audio:
  # Devices are chosen by a case-insensitive name substring, never by index.
  # null means the system default. Run `uv run python -m harness.audio_io` to list names.
  input_device: null
  output_device: null
  allow_speakers: false   # true lets a live run use built-in speakers, for deliberate echo tests
  in_sample_rate: 16000
  out_sample_rate: 24000

vad:
  confidence: 0.7
  start_secs: 0.08   # Silero default 0.2 declares speech after about 192 ms; target a duck within 100 ms
  stop_secs: 0.2     # short silence, then Smart Turn decides
  min_volume: 0.6

turn:
  # auto: Flux end of turn when STT is Deepgram Flux, else Smart Turn v3 (ADR-005)
  stop: auto         # auto | smart_turn | flux | speech_timeout

barge_in:
  # immediate: Pipecat default, any speech during playback interrupts at once.
  # duck: duck-then-decide prototype (harness/ducking.py, ADR-007).
  mode: immediate
  duck_gain: 0.3
  backchannel_max_s: 1.0     # Full-Duplex-Bench v1 backchannel: under 1 s and fewer than 2 words
  backchannel_max_words: 1
  allowlist: ["stop", "wait", "no", "cancel", "pause"]   # quoted: bare no is a YAML boolean

filler:
  # Waiting phrase (harness/filler.py, ADR-009). Off until tested. Never counts toward latency.
  enabled: false
  after_ms: 600      # hypothesis to tune: no reply audio this long after end of turn
  phrase: one_sec    # from harness/phrase_cache.py

paths:
  logs_dir: logs
  data_dir: data
