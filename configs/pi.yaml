# Phase 2 profile: Raspberry Pi 5 with a separate USB mic and USB speaker (ADR-029). Not exercised
# yet (Phase 2 waits for a go). Keep keys identical to mac.yaml so the move is a config change.

profile: pi

audio:
  # Name substrings from `uv run python -m harness.audio_io`. The raw devices show "16k in=no"
  # or "24k out=no", so use pipewire, which resamples. Its defaults are the USB Microphone and
  # the Dell AC511 SoundBar, set in `wpctl status`.
  input_device: pipewire
  output_device: pipewire
  allow_speakers: false   # only built-in laptop speakers are refused
  echo_cancel: true       # WebRTC AEC (ADR-013): a separate speaker and mic have none of their own
  echo_delay_ms: 30       # hint to WebRTC; measured lag 30 ms on the Pi (ADR-029)
  in_sample_rate: 16000
  out_sample_rate: 24000

vad:
  confidence: 0.7
  start_secs: 0.08
  stop_secs: 0.2
  min_volume: 0.6

turn:
  stop: auto            # auto | smart_turn | flux | flux_forced | speech_timeout; Smart Turn timing on one Pi core still to be measured

barge_in:
  # immediate: Pipecat default, any speech during playback interrupts at once.
  # duck: duck-then-decide prototype (harness/ducking.py, ADR-007).
  mode: immediate
  duck_gain: 0.3
  backchannel_max_s: 1.0     # Full-Duplex-Bench v1 backchannel: under 1 s and fewer than 2 words
  backchannel_max_words: 1
  allowlist: ["stop", "wait", "no", "cancel", "pause"]   # quoted: bare no is a YAML boolean

self_echo:
  # With audio.echo_cancel on, a transcript that cut the bot off and repeats its own recent words
  # is dropped instead of answered (harness/self_echo.py, ADR-042). Allowlist words always count.
  enabled: true
  min_words: 3
  window_s: 15

filler:
  # Waiting phrase (harness/filler.py, ADR-009, ADR-033). Never counts toward latency.
  enabled: true
  after_ms: 1500     # no reply audio this long after end of turn (ADR-033)
  # Rotated, never the same one twice in a row. From harness/phrase_cache.py.
  phrases: [one_sec, just_a_moment, let_me_see, on_it, working_on_it]
  # Only these tools play it when they start; a quick tool's reply comes before it would end.
  slow_tools: [search, fetch_content, get_weather, index_documents, bash, serve, write_file, play_music]
  # A quick tool restarts the wait from its start: its reply came 1.45 to 1.64 s later on Nov 4.
  after_tool_ms: 2000

addressing:
  # No wake word (harness/addressing.py, ADR-016). Off until tuned on real rooms.
  enabled: false
  idle_after_s: 30           # ACTIVE lasts this long after the agent spoke or was spoken to
  idle_min_words: 3          # IDLE: shorter fragments are dropped unless they carry a name
  names: []                  # a cue, not a wake word; none chosen yet
  command_verbs: ["set", "add", "list", "send", "cancel", "delete", "read", "turn", "play", "pause",
                  "stop", "start", "remind", "tell", "show", "check", "dim", "skip", "find", "search"]
  require_wake_after_idle: false   # fallback for a noisy room: IDLE then needs a wake phrase
  wake_phrases: ["hey assistant"]
  gate:
    enabled: false           # level gate; only tested on synthetic audio so far
    margin_db: 12            # speech must sit this far above the measured noise floor
    open_ms: 100
    close_ms: 1500           # long enough for STT to see the silence that ends a turn
    pre_roll_ms: 400

recovery:
  # Fixed text, no LLM call (harness/recovery.py).
  llm_error_phrase: "Sorry, I had trouble with that. Could you say it again?"
  # Stored clips from harness/phrase_cache.py, played with no TTS call (ADR-037).
  cap_clip: cap_reached
  network_clip: network_lost

network:
  # Network-loss detection (harness/network.py, ADR-037). TCP connects only, never an API call.
  enabled: true
  probe_timeout_s: 1.5
  probe_attempts: 2        # a host must miss this many connects in a row to count as down
  backoff_s: [1, 2, 4, 8]  # between probes while down; the last repeats

ui:
  # Robot face and device panel in a browser (harness/ui.py, ADR-027). Also on with --ui.
  enabled: false
  host: 127.0.0.1   # this machine only; the mute button has no login
  port: 8770
  spotify_player: false   # play Spotify in the page (ADR-031); also on with --spotify-player

paths:
  logs_dir: logs
  data_dir: data
