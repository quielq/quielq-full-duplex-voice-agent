# Phase 2 profile: Raspberry Pi 5 with a speakerphone. Not exercised yet (Phase 2 waits for a go).
# Keep keys identical to mac.yaml so the move is a config change.

profile: pi

audio:
  input_device: null    # set to the speakerphone (or the PipeWire echo-cancel source) name
  output_device: null
  allow_speakers: false   # only built-in laptop speakers are refused; a speakerphone passes
  echo_cancel: false      # WebRTC AEC in the harness (ADR-013); off when hardware or PipeWire cancels
  echo_delay_ms: 50       # hint to WebRTC; not measured on the Pi
  in_sample_rate: 16000
  out_sample_rate: 24000

vad:
  confidence: 0.7
  start_secs: 0.08
  stop_secs: 0.2
  min_volume: 0.6

turn:
  stop: auto            # auto | smart_turn | flux | speech_timeout; Smart Turn timing on one Pi core still to be measured

barge_in:
  # immediate: Pipecat default, any speech during playback interrupts at once.
  # duck: duck-then-decide prototype (harness/ducking.py, ADR-007).
  mode: immediate
  duck_gain: 0.3
  backchannel_max_s: 1.0     # Full-Duplex-Bench v1 backchannel: under 1 s and fewer than 2 words
  backchannel_max_words: 1
  allowlist: ["stop", "wait", "no", "cancel", "pause"]   # quoted: bare no is a YAML boolean

filler:
  # Waiting phrase (harness/filler.py, ADR-009). Off until tested. Never counts toward latency.
  enabled: false
  after_ms: 600      # hypothesis to tune: no reply audio this long after end of turn
  phrase: one_sec    # from harness/phrase_cache.py

paths:
  logs_dir: logs
  data_dir: data
