<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ME3</title>
<style>
  :root {
    --bg: #0d1014;
    --card: #181d23;
    --line: #2a313a;
    --text: #eef3f7;
    --muted: #93a1ae;
    --glow: #7fd3ee;
    --glow-edge: #b4f5ff;
    --lamp: #ffc15e;
    --warn: #ff7b6b;
    --hull: #c4572c;
    --hull-dark: #9e3a1b;
    --hull-deep: #842814;
    --hull-light: #f28f55;
    --ink: #0a0a0b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 232px;
    gap: 12px;
    height: 100vh;
    height: 100dvh;
    padding: 12px;
  }

  /* Face column */
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .status { display: flex; align-items: center; gap: 8px; height: 26px; color: var(--muted); font-size: 15px; }
  .status b { color: var(--glow); font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--glow); }
  body[data-link="off"] .dot { background: var(--warn); }
  .face-box { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #robot { width: 100%; height: 100%; max-height: 100%; animation: bob 4.5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .caption { height: 62px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .caption p { margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #heard { color: var(--muted); font-size: 15px; }
  #said {
    font-size: 18px;
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* Expressions: every set is drawn, and only the current one shows */
  .set { opacity: 0; transition: opacity 140ms linear; }
  svg[data-face="neutral"] .set.neutral,
  svg[data-face="happy"] .set.happy,
  svg[data-face="sad"] .set.sad,
  svg[data-face="angry"] .set.angry,
  svg[data-face="listening"] .set.listening,
  svg[data-face="thinking"] .set.thinking,
  svg[data-face="working"] .set.working,
  svg[data-face="asking"] .set.asking,
  svg[data-face="muted"] .set.muted { opacity: 1; }
  .glow { fill: var(--glow); stroke: var(--glow-edge); stroke-width: 4; stroke-linejoin: round; }
  .glow-line { fill: none; stroke: var(--glow); stroke-width: 11; stroke-linecap: round; }
  .eyes { transform-box: fill-box; transform-origin: center; transition: transform 70ms linear; }
  svg.blink .eyes.blinks { transform: scaleY(0.06); }
  svg.talking .mouth { opacity: 0; }
  #talk { opacity: 0; transition: opacity 80ms linear; }
  svg.talking #talk { opacity: 1; }
  .scan { animation: scan 1.4s ease-in-out infinite alternate; }
  @keyframes scan { from { transform: translateX(-34px); } to { transform: translateX(34px); } }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  .pulse.two { animation-delay: 0.2s; }
  .pulse.three { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  .ring { fill: none; stroke: var(--glow); stroke-width: 6; opacity: 0; }
  svg[data-face="listening"] .ring { animation: ring 1.5s ease-out infinite; }
  svg[data-face="listening"] .ring.later { animation-delay: 0.5s; }
  @keyframes ring { 0% { opacity: 0.8; } 100% { opacity: 0; } }

  /* Device panel */
  .panel { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .card h2 { margin: 0 0 4px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .light { display: flex; align-items: center; gap: 8px; height: 25px; font-size: 15px; text-transform: capitalize; }
  .lamp { width: 13px; height: 13px; border-radius: 50%; background: var(--line); }
  .light.on .lamp { background: var(--lamp); box-shadow: 0 0 8px var(--lamp); }
  .light span:last-child { margin-left: auto; color: var(--muted); }
  .temp { display: flex; align-items: baseline; gap: 8px; }
  .temp strong { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .temp span { color: var(--muted); font-size: 14px; text-transform: capitalize; }
  .one-line { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; }
  .timer { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .timer span:first-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .fill { flex: 1; min-height: 0; overflow: hidden; }
  button {
    min-height: 52px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    touch-action: manipulation;
  }
  button[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #1c0805; }

  @media (max-width: 620px), (max-aspect-ratio: 1/1) {
    body { overflow: auto; }
    main { display: block; height: auto; padding: 16px; }
    .face-box { height: 46vh; }
    .panel { margin-top: 12px; }
  }
</style>
</head>
<body data-link="off">
<main>
  <section class="stage">
    <div class="status"><i class="dot"></i><b id="state">Connecting</b><span id="step"></span></div>
    <div class="face-box">
      <svg id="robot" viewBox="0 0 1000 660" data-face="sad" role="img" aria-label="Robot face" preserveAspectRatio="xMidYMid meet">
        <!-- Shell -->
        <path d="M84 212 C40 225 28 300 32 350 C36 410 56 450 88 470 Z" fill="var(--hull-dark)" stroke="var(--ink)" stroke-width="7"/>
        <path d="M78 400 C72 250 110 120 270 55 C370 20 520 22 640 65 C730 100 790 160 815 230 L805 525 C760 600 640 632 480 632 C340 630 200 615 135 575 C95 540 85 470 78 400 Z" fill="var(--hull)" stroke="var(--ink)" stroke-width="7"/>
        <path d="M84 440 C100 540 130 570 170 585 C260 618 390 628 480 629 C630 628 750 600 803 526 L812 240 C760 215 730 240 712 300 C704 340 708 480 700 530 C640 590 460 610 330 600 C210 590 130 540 84 440 Z" fill="var(--hull-dark)"/>
        <path d="M112 280 C140 170 250 120 420 120 C540 120 640 140 668 180 C680 200 672 225 668 240 C640 170 520 140 390 140 C240 142 140 180 118 260 Z" fill="var(--hull-dark)"/>
        <path d="M145 158 C170 120 220 100 255 95 C262 118 195 158 150 162 Z" fill="var(--hull-light)"/>
        <ellipse cx="278" cy="81" rx="17" ry="8" transform="rotate(-14 278 81)" fill="var(--hull-light)"/>
        <!-- Visor -->
        <path d="M120 360 C120 250 135 190 205 170 C330 140 520 148 630 185 C660 200 670 270 670 340 C668 430 655 490 630 525 C590 565 430 578 300 572 C220 568 160 545 140 505 C125 470 120 420 120 360 Z" fill="#2d2e30" stroke="var(--ink)" stroke-width="9"/>
        <path d="M520 166 C590 200 600 280 590 340 C575 440 555 505 500 548 C560 545 610 535 628 520 C652 488 664 430 665 340 C665 270 656 205 628 188 C595 176 555 170 520 166 Z" fill="#121315"/>
        <path d="M318 176 C270 190 180 215 160 240 C148 300 148 400 170 500 C190 530 225 542 258 545 C220 480 205 400 215 320 C225 250 270 205 318 176 Z" fill="#fff" opacity="0.18"/>
        <!-- Ear and lens -->
        <path d="M800 232 C830 225 870 235 905 250 C945 262 960 330 955 390 C950 470 915 520 870 520 L790 522 C740 510 715 450 718 380 C722 300 750 240 800 232 Z" fill="var(--hull)" stroke="var(--ink)" stroke-width="7"/>
        <ellipse class="ring" cx="878" cy="388" rx="88" ry="144" transform="rotate(5 878 388)"/>
        <ellipse class="ring later" cx="878" cy="388" rx="102" ry="158" transform="rotate(5 878 388)"/>
        <ellipse cx="878" cy="388" rx="76" ry="132" transform="rotate(5 878 388)" fill="#2c2c2f" stroke="var(--ink)" stroke-width="6"/>
        <ellipse cx="878" cy="388" rx="60" ry="112" transform="rotate(5 878 388)" fill="#101012"/>
        <ellipse cx="878" cy="388" rx="42" ry="88" transform="rotate(5 878 388)" fill="#7fd3ee"/>
        <path d="M866 306 C835 340 830 440 866 470 C888 440 884 340 866 306 Z" fill="#3fa9d8"/>

        <!-- Neutral -->
        <g class="set neutral">
          <g class="eyes blinks"><ellipse class="glow" cx="248" cy="322" rx="40" ry="71"/><ellipse class="glow" cx="504" cy="326" rx="40" ry="71"/></g>
          <path class="glow-line mouth" d="M265 435 C295 512 430 515 462 442"/>
        </g>
        <!-- Happy -->
        <g class="set happy">
          <g class="eyes">
            <path id="arch" class="glow" d="M200 348 C190 270 215 238 247 238 C282 240 300 290 298 340 C295 352 285 346 282 335 C270 305 235 295 215 335 C210 355 200 356 200 348 Z"/>
            <use href="#arch" x="262"/>
          </g>
          <path class="glow mouth" d="M252 412 C300 430 420 430 500 412 C515 410 510 430 500 450 C470 490 420 508 372 508 C320 505 275 480 255 440 C248 425 245 412 252 412 Z"/>
        </g>
        <!-- Sad -->
        <g class="set sad">
          <rect class="glow" x="176" y="310" width="131" height="23"/><rect class="glow" x="422" y="310" width="135" height="23"/>
          <path class="glow-line mouth" d="M268 495 C285 425 440 425 470 490"/>
        </g>
        <!-- Angry -->
        <g class="set angry">
          <path class="glow" d="M190 258 L326 377 C280 395 195 392 190 258 Z"/>
          <path class="glow" d="M560 258 L427 377 C490 395 565 370 560 258 Z"/>
          <path class="glow mouth" d="M278 522 C340 490 420 445 475 440 C500 445 512 490 498 530 C430 538 340 540 278 522 Z"/>
        </g>
        <!-- Listening: wide eyes, rings on the lens -->
        <g class="set listening">
          <g class="eyes blinks"><ellipse class="glow" cx="248" cy="316" rx="48" ry="82"/><ellipse class="glow" cx="504" cy="320" rx="48" ry="82"/></g>
          <ellipse class="glow mouth" cx="366" cy="462" rx="24" ry="17"/>
        </g>
        <!-- Thinking: eyes up and aside, dots -->
        <g class="set thinking">
          <g class="eyes blinks"><ellipse class="glow" cx="282" cy="292" rx="36" ry="58"/><ellipse class="glow" cx="526" cy="294" rx="36" ry="58"/></g>
          <path class="glow-line mouth" d="M322 456 C355 472 395 466 426 448"/>
          <circle class="glow pulse" cx="470" cy="486" r="10"/><circle class="glow pulse two" cx="504" cy="486" r="10"/><circle class="glow pulse three" cx="538" cy="486" r="10"/>
        </g>
        <!-- Working: eyes scan side to side -->
        <g class="set working">
          <g class="scan"><rect class="glow" x="210" y="292" width="84" height="46" rx="20"/><rect class="glow" x="462" y="292" width="84" height="46" rx="20"/></g>
          <path class="glow-line mouth" d="M300 460 L440 460"/>
        </g>
        <!-- Asking: one eye bigger, a small open mouth -->
        <g class="set asking">
          <g class="eyes blinks"><ellipse class="glow" cx="248" cy="330" rx="34" ry="56"/><ellipse class="glow" cx="504" cy="308" rx="46" ry="84"/></g>
          <ellipse class="glow mouth" cx="372" cy="462" rx="22" ry="24"/>
        </g>
        <!-- Muted: asleep -->
        <g class="set muted">
          <path class="glow-line" d="M190 340 C225 358 270 358 305 340"/><path class="glow-line" d="M445 340 C480 358 525 358 560 340"/>
          <path class="glow-line mouth" d="M340 460 L400 460"/>
        </g>
        <!-- Talking mouth, shared by the faces that can speak -->
        <ellipse id="talk" class="glow" cx="372" cy="462" rx="74" ry="12"/>
      </svg>
    </div>
    <div class="caption">
      <p id="heard"></p>
      <p id="said"></p>
    </div>
  </section>

  <aside class="panel">
    <div class="card"><h2>Lights</h2><div id="lights"></div></div>
    <div class="card"><h2>Thermostat</h2><div class="temp"><strong id="temp">--</strong><span id="mode"></span></div></div>
    <div class="card"><h2>Music</h2><div class="one-line" id="music">Nothing playing</div></div>
    <div class="card fill"><h2>Timers</h2><div id="timers"><div class="one-line">None set</div></div></div>
    <button id="mute" aria-pressed="false">Mute mic</button>
  </aside>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const robot = $("robot");
  const LABELS = { idle: "Ready", listening: "Listening", thinking: "Thinking", working: "Working",
                   asking: "Waiting for your answer", speaking: "Speaking" };
  let timers = [];
  let playerLoaded = false;

  function row(parent, cls, cells) {
    const div = document.createElement("div");
    div.className = cls;
    for (const [text, className] of cells) {
      const span = document.createElement("span");
      if (className) span.className = className;
      span.textContent = text;
      div.append(span);
    }
    parent.append(div);
  }

  function clock(seconds) {
    const s = Math.max(0, Math.round(seconds));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${r}` : `${m}:${r}`;
  }

  function drawTimers() {
    const box = $("timers");
    box.textContent = "";
    if (!timers.length) {
      row(box, "one-line", [["None set"]]);
      return;
    }
    const now = Date.now() / 1000;
    for (const t of timers) row(box, "timer", [[t.label || t.kind], [clock(t.fires_at - now)]]);
  }

  function draw(s) {
    robot.dataset.face = s.face;
    robot.classList.toggle("talking", s.talking);
    $("state").textContent = s.muted ? "Mic muted" : s.voice_down ? "Voice is down" : LABELS[s.activity];
    $("step").textContent = s.step;
    $("heard").textContent = s.heard;
    $("said").textContent = s.said;
    const lights = $("lights");
    lights.textContent = "";
    for (const l of s.lights) {
      row(lights, "light" + (l.is_on ? " on" : ""), [["", "lamp"], [l.room], [l.is_on ? l.brightness + "%" : "Off"]]);
    }
    $("temp").textContent = s.thermostat.target_c + "°C";
    $("mode").textContent = s.thermostat.mode;
    if (s.spotify_player && !playerLoaded) {   // off by default, so the page stays self-contained
      playerLoaded = true;
      const script = document.createElement("script");
      script.src = "/spotify-player.js";
      document.head.append(script);
    }
    $("music").textContent = s.music.now_playing
      ? (s.music.playing ? "" : "Paused: ") + s.music.now_playing
      : "Nothing playing";
    timers = s.timers;
    drawTimers();
    const mute = $("mute");
    mute.textContent = s.muted ? "Mic is muted" : "Mute mic";
    mute.setAttribute("aria-pressed", s.muted);
  }

  function connect() {
    const stream = new EventSource("/events");
    stream.onopen = () => { document.body.dataset.link = "on"; };
    stream.onmessage = (e) => { document.body.dataset.link = "on"; draw(JSON.parse(e.data)); };
    stream.onerror = () => {   // EventSource reconnects by itself
      document.body.dataset.link = "off";
      robot.dataset.face = "sad";
      robot.classList.remove("talking");
      $("state").textContent = "Agent not running";
      $("step").textContent = "";
    };
  }

  $("mute").addEventListener("click", () => fetch("/api/mute", { method: "POST" }));

  // The mouth follows a made-up rhythm, not the audio: the page never receives audio.
  setInterval(() => {
    if (robot.classList.contains("talking")) $("talk").setAttribute("ry", 10 + Math.random() * 34);
  }, 90);

  (function blink() {
    setTimeout(() => {
      robot.classList.add("blink");
      setTimeout(() => { robot.classList.remove("blink"); blink(); }, 130);
    }, 2500 + Math.random() * 3500);
  })();

  setInterval(() => { if (timers.length) drawTimers(); }, 1000);
  connect();
</script>
</body>
</html>
