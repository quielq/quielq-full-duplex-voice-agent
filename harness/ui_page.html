<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ME3</title>
<style>
  /* One self-contained file: no fonts, images, or scripts from outside (ADR-027).
     Cheap on the Pi: no filters or blur, motion only on transform and opacity, and each panel
     section is redrawn only when its data changes (ADR-038). */
  :root {
    --bg: #0d1014;
    --card: #181d23;
    --card-2: #20262e;
    --line: #2a313a;
    --text: #eef3f7;
    --muted: #93a1ae;
    --glow: #7fd3ee;
    --glow-edge: color-mix(in srgb, var(--glow) 55%, white);
    --glow-deep: color-mix(in srgb, var(--glow) 62%, black);
    --lamp: #ffc15e;
    --warn: #ff7b6b;
    --cool: #6cc3ff;
    --heat: #ff9a5c;
    --ink: #0a0a0b;
  }
  /* The shell takes the agent's colour too. Set on each robot drawing, so a small icon with
     its own --glow gets its own shades. */
  .tinted {
    --glow-edge: color-mix(in srgb, var(--glow) 55%, white);
    --glow-deep: color-mix(in srgb, var(--glow) 62%, black);
    --hull: color-mix(in srgb, var(--glow) 62%, #2a1a12);
    --hull-dark: color-mix(in srgb, var(--glow) 44%, #160d08);
    --hull-deep: color-mix(in srgb, var(--glow) 34%, #0d0805);
    --hull-light: color-mix(in srgb, var(--glow) 72%, white);
  }
  .mini { width: 44px; height: 30px; flex: none; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 10px 12px;
    height: 100vh;
    height: 100dvh;
    padding: 10px 12px 12px;
  }
  button {
    min-height: 48px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    touch-action: manipulation;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #1c0805; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* Top bar */
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  #agent-chip {
    display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 10px;
    border-color: color-mix(in srgb, var(--glow) 45%, var(--line));
  }
  #agent-chip small { color: var(--muted); font-weight: 500; }
  .status { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; color: var(--muted); font-size: 15px; }
  .status b { color: var(--glow); font-weight: 600; white-space: nowrap; }
  #step { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--glow); flex: none; }
  body[data-link="off"] .dot { background: var(--warn); }
  #mute { padding: 0 16px; }

  /* Face column */
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .face-box { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #robot { width: 100%; height: 100%; max-height: 100%; animation: bob 4.5s ease-in-out infinite; }
  body.rest #robot, body.rest .scan, body.rest .pulse { animation-play-state: paused; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .caption { height: 64px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .caption p { margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #heard { color: var(--muted); font-size: 15px; }
  #said { font-size: 18px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* Expressions: every set is drawn, and only the current one shows */
  .set { opacity: 0; transition: opacity 140ms linear; }
  svg[data-face="neutral"] .set.neutral,
  svg[data-face="happy"] .set.happy,
  svg[data-face="sad"] .set.sad,
  svg[data-face="angry"] .set.angry,
  svg[data-face="listening"] .set.listening,
  svg[data-face="thinking"] .set.thinking,
  svg[data-face="working"] .set.working,
  svg[data-face="asking"] .set.asking,
  svg[data-face="muted"] .set.muted { opacity: 1; }
  .glow { fill: var(--glow); stroke: var(--glow-edge); stroke-width: 4; stroke-linejoin: round; }
  .glow-line { fill: none; stroke: var(--glow); stroke-width: 11; stroke-linecap: round; }
  .lens { fill: var(--glow); }
  .lens-shade { fill: var(--glow-deep); }
  .eyes { transform-box: fill-box; transform-origin: center; transition: transform 70ms linear; }
  svg.blink .eyes.blinks { transform: scaleY(0.06); }
  svg.talking .mouth { opacity: 0; }
  #talk { opacity: 0; transition: opacity 80ms linear; }
  svg.talking #talk { opacity: 1; }
  .scan { animation: scan 1.4s ease-in-out infinite alternate; }
  @keyframes scan { from { transform: translateX(-34px); } to { transform: translateX(34px); } }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  .pulse.two { animation-delay: 0.2s; }
  .pulse.three { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  .ring { fill: none; stroke: var(--glow); stroke-width: 6; opacity: 0; }
  svg[data-face="listening"] .ring { animation: ring 1.5s ease-out infinite; }
  svg[data-face="listening"] .ring.later { animation-delay: 0.5s; }
  @keyframes ring { 0% { opacity: 0.8; } 100% { opacity: 0; } }

  /* Side panel with two tabs */
  .panel { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tabs button { min-height: 44px; color: var(--muted); }
  .tabs button[aria-selected="true"] { color: var(--text); background: var(--card-2); border-color: color-mix(in srgb, var(--glow) 50%, var(--line)); }
  .tab { display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 1; overflow-y: auto; }
  .tab[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; }
  .card h2 { margin: 0 0 6px; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .empty { color: var(--muted); font-size: 15px; }

  /* Lights: one bulb per room, filled by brightness */
  #lights { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
  .bulb { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 0; padding: 6px 2px; border-radius: 10px;
          background: var(--card-2); border-color: transparent; font-weight: 400; }
  .bulb.on { border-color: color-mix(in srgb, var(--lamp) 45%, transparent); }
  .bulb:disabled { cursor: default; }
  .bulb svg { width: 34px; height: 34px; }
  .bulb .glass { fill: var(--line); }
  .bulb.on .glass { fill: var(--lamp); }
  .bulb .rays { stroke: var(--lamp); stroke-width: 2.5; stroke-linecap: round; opacity: 0; }
  .bulb.on .rays { opacity: var(--level); }
  .bulb .base { fill: #59626d; }
  .bulb b { font-size: 13px; font-weight: 600; text-transform: capitalize; text-align: center; line-height: 1.15; }
  .bulb span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Thermostat dial */
  .thermo { display: flex; align-items: center; gap: 10px; }
  .thermo svg { width: 118px; height: 74px; flex: none; }
  .thermo .track { fill: none; stroke: var(--line); stroke-width: 10; stroke-linecap: round; }
  .thermo .level { fill: none; stroke: var(--mode-color, var(--muted)); stroke-width: 10; stroke-linecap: round; }
  .thermo text { fill: var(--text); font-size: 22px; font-weight: 600; text-anchor: middle; font-variant-numeric: tabular-nums; }
  .mode { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 600;
          background: color-mix(in srgb, var(--mode-color, var(--muted)) 22%, transparent); color: var(--mode-color, var(--muted)); text-transform: capitalize; }
  .thermo small { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
  #thermo-card .controls { margin-top: 8px; }

  /* Music */
  #music { font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-bottom: 8px; }
  #music.paused { color: var(--muted); }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .controls button { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .controls svg { width: 20px; height: 20px; fill: currentColor; }
  .controls button:disabled { opacity: 0.45; cursor: default; }

  /* Timers and alarms: a ring shows how much is left */
  .timer { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .timer svg { width: 40px; height: 40px; flex: none; transform: rotate(-90deg); }
  .timer .track { fill: none; stroke: var(--line); stroke-width: 5; }
  .timer .left { fill: none; stroke: var(--glow); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .timer.alarm .left { stroke: var(--lamp); }
  .timer div { min-width: 0; }
  .timer b { display: block; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .timer span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

  /* Chat history */
  #chat { display: flex; flex-direction: column; gap: 6px; padding: 2px; user-select: text; -webkit-user-select: text; }
  .msg { max-width: 88%; padding: 7px 10px; border-radius: 12px; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--card-2); border: 1px solid var(--line); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: color-mix(in srgb, var(--glow) 16%, var(--card)); border: 1px solid color-mix(in srgb, var(--glow) 35%, var(--line)); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 13px; padding: 2px 8px; }

  /* Agent sheet: the picker and the builder */
  dialog { width: min(760px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 16px;
           background: var(--bg); color: var(--text); }
  dialog::backdrop { background: rgb(0 0 0 / 0.6); }
  .sheet { display: flex; flex-direction: column; max-height: calc(100dvh - 34px); }
  .sheet header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .sheet header h2 { margin: 0; font-size: 18px; flex: 1; }
  .sheet header button { padding: 0 16px; }
  .sheet .body { padding: 12px 14px; overflow-y: auto; }
  #agent-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .agent-item { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .agent-item[data-current="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--card)); }
  .agent { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; column-gap: 10px; text-align: left; padding: 8px 10px; min-height: 84px; }
  .agent .mini { width: 64px; height: 44px; grid-row: 1 / 4; }
  .agent-item select { margin-top: 0; min-height: 44px; font-size: 14px; }
  .agent-item .note { margin: 0; color: var(--muted); font-size: 12px; }
  .agent[aria-current="true"] { background: color-mix(in srgb, var(--c) 18%, var(--card)); }
  .agent b { font-size: 16px; }
  .agent span { color: var(--muted); font-size: 13px; font-weight: 500; }
  .agent em { color: var(--muted); font-size: 12px; font-style: normal; font-weight: 500; }
  .agent-row { display: flex; gap: 6px; }
  .agent-row select { flex: 1; min-width: 0; }
  .agent-row .edit { width: 64px; min-height: 44px; font-size: 14px; flex: none; }
  form { display: grid; gap: 12px; }
  label, legend { font-size: 14px; color: var(--muted); font-weight: 600; }
  input[type="text"], select { width: 100%; min-height: 48px; margin-top: 4px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
                              background: var(--card); color: var(--text); font: inherit; }
  fieldset { border: 1px solid var(--line); border-radius: 12px; margin: 0; padding: 8px 10px 10px; min-width: 0; }
  .colors { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .colors label { position: relative; }
  .colors input { position: absolute; opacity: 0; inset: 0; }
  .colors span { display: flex; align-items: center; justify-content: center; width: 64px; height: 50px; border-radius: 12px;
                 background: var(--card); border: 3px solid transparent; }
  .colors .mini { width: 56px; height: 38px; }
  .colors input:checked + span { border-color: var(--text); }
  .colors input:focus-visible + span { outline: 3px solid var(--text); outline-offset: 2px; }
  .docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 10px; max-height: 190px; overflow-y: auto; margin-top: 6px; }
  .docs label { display: flex; align-items: center; gap: 8px; min-height: 40px; color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
  .docs input { width: 22px; height: 22px; flex: none; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .form-actions button { padding: 0 20px; }
  .primary { background: var(--glow); border-color: var(--glow); color: #07181d; }
  .danger { color: var(--warn); }
  #form-error { color: var(--warn); min-height: 1.3em; margin: 0; font-size: 14px; }

  @media (max-width: 720px), (max-aspect-ratio: 1/1) {
    body { overflow: auto; }
    main { display: block; height: auto; padding: 12px 16px 16px; }
    .top { flex-wrap: wrap; margin-bottom: 8px; }
    .top .status { order: 3; flex-basis: 100%; }
    #agent-chip { flex: 1; }
    .face-box { height: 42vh; }
    .panel { margin-top: 12px; }
    .tab { overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) {
    #robot, .scan, .pulse, .ring { animation: none !important; }
  }
</style>
</head>
<body data-link="off">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- A small robot for the agent chip, the picker and the builder: no motion, drawn once per use -->
  <symbol id="mini-robot" viewBox="20 15 950 630">
    <path d="M78 400 C72 250 110 120 270 55 C370 20 520 22 640 65 C730 100 790 160 815 230 L805 525 C760 600 640 632 480 632 C340 630 200 615 135 575 C95 540 85 470 78 400 Z" fill="var(--hull)" stroke="var(--ink)" stroke-width="16"/>
    <path d="M84 440 C100 540 130 570 170 585 C260 618 390 628 480 629 C630 628 750 600 803 526 L812 240 C760 215 730 240 712 300 C704 340 708 480 700 530 C640 590 460 610 330 600 C210 590 130 540 84 440 Z" fill="var(--hull-dark)"/>
    <path d="M120 360 C120 250 135 190 205 170 C330 140 520 148 630 185 C660 200 670 270 670 340 C668 430 655 490 630 525 C590 565 430 578 300 572 C220 568 160 545 140 505 C125 470 120 420 120 360 Z" fill="#2d2e30" stroke="var(--ink)" stroke-width="16"/>
    <path d="M800 232 C830 225 870 235 905 250 C945 262 960 330 955 390 C950 470 915 520 870 520 L790 522 C740 510 715 450 718 380 C722 300 750 240 800 232 Z" fill="var(--hull)" stroke="var(--ink)" stroke-width="16"/>
    <ellipse cx="878" cy="388" rx="60" ry="112" transform="rotate(5 878 388)" fill="#101012"/>
    <ellipse cx="878" cy="388" rx="42" ry="88" transform="rotate(5 878 388)" fill="var(--glow)"/>
    <ellipse cx="248" cy="322" rx="46" ry="76" fill="var(--glow)"/><ellipse cx="504" cy="326" rx="46" ry="76" fill="var(--glow)"/>
    <path d="M265 435 C295 512 430 515 462 442" fill="none" stroke="var(--glow)" stroke-width="22" stroke-linecap="round"/>
  </symbol>
</svg>
<main>
  <div class="top">
    <button id="agent-chip" aria-haspopup="dialog" aria-label="Choose an agent"><svg class="mini tinted" aria-hidden="true"><use href="#mini-robot"/></svg><span id="agent-name">Generalist</span><small>Change</small></button>
    <div class="status" role="status"><i class="dot"></i><b id="state">Connecting</b><span id="step"></span></div>
    <button id="mute" aria-pressed="false">Mute mic</button>
  </div>

  <section class="stage">
    <div class="face-box">
      <svg id="robot" class="tinted" viewBox="0 0 1000 660" data-face="sad" role="img" aria-label="Robot face" preserveAspectRatio="xMidYMid meet">
        <!-- Shell -->
        <path d="M84 212 C40 225 28 300 32 350 C36 410 56 450 88 470 Z" fill="var(--hull-dark)" stroke="var(--ink)" stroke-width="7"/>
        <path d="M78 400 C72 250 110 120 270 55 C370 20 520 22 640 65 C730 100 790 160 815 230 L805 525 C760 600 640 632 480 632 C340 630 200 615 135 575 C95 540 85 470 78 400 Z" fill="var(--hull)" stroke="var(--ink)" stroke-width="7"/>
        <path d="M84 440 C100 540 130 570 170 585 C260 618 390 628 480 629 C630 628 750 600 803 526 L812 240 C760 215 730 240 712 300 C704 340 708 480 700 530 C640 590 460 610 330 600 C210 590 130 540 84 440 Z" fill="var(--hull-dark)"/>
        <path d="M112 280 C140 170 250 120 420 120 C540 120 640 140 668 180 C680 200 672 225 668 240 C640 170 520 140 390 140 C240 142 140 180 118 260 Z" fill="var(--hull-dark)"/>
        <path d="M145 158 C170 120 220 100 255 95 C262 118 195 158 150 162 Z" fill="var(--hull-light)"/>
        <ellipse cx="278" cy="81" rx="17" ry="8" transform="rotate(-14 278 81)" fill="var(--hull-light)"/>
        <!-- Visor -->
        <path d="M120 360 C120 250 135 190 205 170 C330 140 520 148 630 185 C660 200 670 270 670 340 C668 430 655 490 630 525 C590 565 430 578 300 572 C220 568 160 545 140 505 C125 470 120 420 120 360 Z" fill="#2d2e30" stroke="var(--ink)" stroke-width="9"/>
        <path d="M520 166 C590 200 600 280 590 340 C575 440 555 505 500 548 C560 545 610 535 628 520 C652 488 664 430 665 340 C665 270 656 205 628 188 C595 176 555 170 520 166 Z" fill="#121315"/>
        <path d="M318 176 C270 190 180 215 160 240 C148 300 148 400 170 500 C190 530 225 542 258 545 C220 480 205 400 215 320 C225 250 270 205 318 176 Z" fill="#fff" opacity="0.18"/>
        <!-- Ear and lens -->
        <path d="M800 232 C830 225 870 235 905 250 C945 262 960 330 955 390 C950 470 915 520 870 520 L790 522 C740 510 715 450 718 380 C722 300 750 240 800 232 Z" fill="var(--hull)" stroke="var(--ink)" stroke-width="7"/>
        <ellipse class="ring" cx="878" cy="388" rx="88" ry="144" transform="rotate(5 878 388)"/>
        <ellipse class="ring later" cx="878" cy="388" rx="102" ry="158" transform="rotate(5 878 388)"/>
        <ellipse cx="878" cy="388" rx="76" ry="132" transform="rotate(5 878 388)" fill="#2c2c2f" stroke="var(--ink)" stroke-width="6"/>
        <ellipse cx="878" cy="388" rx="60" ry="112" transform="rotate(5 878 388)" fill="#101012"/>
        <ellipse cx="878" cy="388" rx="42" ry="88" transform="rotate(5 878 388)" class="lens"/>
        <path d="M866 306 C835 340 830 440 866 470 C888 440 884 340 866 306 Z" class="lens-shade"/>

        <!-- Neutral -->
        <g class="set neutral">
          <g class="eyes blinks"><ellipse class="glow" cx="248" cy="322" rx="40" ry="71"/><ellipse class="glow" cx="504" cy="326" rx="40" ry="71"/></g>
          <path class="glow-line mouth" d="M265 435 C295 512 430 515 462 442"/>
        </g>
        <!-- Happy -->
        <g class="set happy">
          <g class="eyes">
            <path id="arch" class="glow" d="M200 348 C190 270 215 238 247 238 C282 240 300 290 298 340 C295 352 285 346 282 335 C270 305 235 295 215 335 C210 355 200 356 200 348 Z"/>
            <use href="#arch" x="262"/>
          </g>
          <path class="glow mouth" d="M252 412 C300 430 420 430 500 412 C515 410 510 430 500 450 C470 490 420 508 372 508 C320 505 275 480 255 440 C248 425 245 412 252 412 Z"/>
        </g>
        <!-- Sad -->
        <g class="set sad">
          <rect class="glow" x="176" y="310" width="131" height="23"/><rect class="glow" x="422" y="310" width="135" height="23"/>
          <path class="glow-line mouth" d="M268 495 C285 425 440 425 470 490"/>
        </g>
        <!-- Angry -->
        <g class="set angry">
          <path class="glow" d="M190 258 L326 377 C280 395 195 392 190 258 Z"/>
          <path class="glow" d="M560 258 L427 377 C490 395 565 370 560 258 Z"/>
          <path class="glow mouth" d="M278 522 C340 490 420 445 475 440 C500 445 512 490 498 530 C430 538 340 540 278 522 Z"/>
        </g>
        <!-- Listening: wide eyes, rings on the lens -->
        <g class="set listening">
          <g class="eyes blinks"><ellipse class="glow" cx="248" cy="316" rx="48" ry="82"/><ellipse class="glow" cx="504" cy="320" rx="48" ry="82"/></g>
          <ellipse class="glow mouth" cx="366" cy="462" rx="24" ry="17"/>
        </g>
        <!-- Thinking: eyes up and aside, dots -->
        <g class="set thinking">
          <g class="eyes blinks"><ellipse class="glow" cx="282" cy="292" rx="36" ry="58"/><ellipse class="glow" cx="526" cy="294" rx="36" ry="58"/></g>
          <path class="glow-line mouth" d="M322 456 C355 472 395 466 426 448"/>
          <circle class="glow pulse" cx="470" cy="486" r="10"/><circle class="glow pulse two" cx="504" cy="486" r="10"/><circle class="glow pulse three" cx="538" cy="486" r="10"/>
        </g>
        <!-- Working: eyes scan side to side -->
        <g class="set working">
          <g class="scan"><rect class="glow" x="210" y="292" width="84" height="46" rx="20"/><rect class="glow" x="462" y="292" width="84" height="46" rx="20"/></g>
          <path class="glow-line mouth" d="M300 460 L440 460"/>
        </g>
        <!-- Asking: one eye bigger, a small open mouth -->
        <g class="set asking">
          <g class="eyes blinks"><ellipse class="glow" cx="248" cy="330" rx="34" ry="56"/><ellipse class="glow" cx="504" cy="308" rx="46" ry="84"/></g>
          <ellipse class="glow mouth" cx="372" cy="462" rx="22" ry="24"/>
        </g>
        <!-- Muted: asleep -->
        <g class="set muted">
          <path class="glow-line" d="M190 340 C225 358 270 358 305 340"/><path class="glow-line" d="M445 340 C480 358 525 358 560 340"/>
          <path class="glow-line mouth" d="M340 460 L400 460"/>
        </g>
        <!-- Talking mouth, shared by the faces that can speak -->
        <ellipse id="talk" class="glow" cx="372" cy="462" rx="74" ry="12"/>
      </svg>
    </div>
    <div class="caption" aria-live="polite">
      <p id="heard"></p>
      <p id="said"></p>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-home" aria-selected="true" aria-controls="home">Home</button>
      <button role="tab" id="tab-chat" aria-selected="false" aria-controls="chat-box">Chat</button>
    </div>
    <div class="tab" id="home" role="tabpanel" aria-labelledby="tab-home">
      <div class="card"><h2>Lights</h2><div id="lights"></div></div>
      <div class="card" id="thermo-card"><h2>Thermostat</h2><div class="thermo" id="thermo">
        <svg viewBox="0 0 120 74" aria-hidden="true">
          <path class="track" d="M12 66 A48 48 0 0 1 108 66"/>
          <path class="level" id="thermo-level" d="M12 66 A48 48 0 0 1 108 66" pathLength="100" stroke-dasharray="0 100"/>
          <text x="60" y="64" id="temp">--</text>
        </svg>
        <div><span class="mode" id="mode">--</span><small>Range 16 to 30 °C</small></div>
      </div>
        <div class="controls">
          <button id="cooler" aria-label="Half a degree cooler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2H5z"/></svg><span>Cooler</span></button>
          <button id="warmer" aria-label="Half a degree warmer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg><span>Warmer</span></button>
        </div>
      </div>
      <div class="card"><h2>Music</h2>
        <div id="music">Nothing playing</div>
        <div class="controls">
          <button id="play" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><span>Pause</span></button>
          <button id="next" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7zM16 5h3v14h-3z"/></svg><span>Next</span></button>
        </div>
      </div>
      <div class="card"><h2>Timers and alarms</h2><div id="timers"><div class="empty">None set</div></div></div>
    </div>
    <div class="tab" id="chat-box" role="tabpanel" aria-labelledby="tab-chat" hidden>
      <div id="chat" aria-live="polite"><div class="msg system">Nothing said yet</div></div>
    </div>
  </aside>
</main>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet">
    <header><h2 id="sheet-title">Choose an agent</h2><button id="new-agent">New agent</button><button id="close-sheet">Close</button></header>
    <div class="body">
      <div id="agent-list"></div>
      <form id="builder" hidden>
        <label>Name <input type="text" name="name" maxlength="32" autocomplete="off" required></label>
        <label>What it helps with <input type="text" name="description" maxlength="120" autocomplete="off"></label>
        <label>Model <select name="model" id="model"></select></label>
        <fieldset><legend>Colour</legend><div class="colors" id="colors"></div></fieldset>
        <fieldset><legend>Documents it may answer from</legend><div class="docs" id="docs"></div></fieldset>
        <p id="form-error" role="alert"></p>
        <div class="form-actions">
          <button type="button" class="danger" id="delete-agent" hidden>Delete</button>
          <button type="button" id="cancel-form">Back</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</dialog>

<script>
  const $ = (id) => document.getElementById(id);
  const robot = $("robot");
  const LABELS = { idle: "Ready", listening: "Listening", thinking: "Thinking", working: "Working",
                   asking: "Waiting for your answer", speaking: "Speaking" };
  const MODE_COLORS = { cool: "var(--cool)", heat: "var(--heat)", off: "var(--muted)" };
  const RING = 2 * Math.PI * 16;
  const REST_AFTER_MS = 60000;
  let timers = [];
  let playerLoaded = false;
  let last = {};          // what each section last drew, so unchanged sections are left alone
  let state = null;
  let idleSince = Date.now();
  let talkTimer = null;
  let catalog = null;     // the agent list from /api/agents, while the sheet is open
  let editing = null;
  let pendingTarget = null;   // the setpoint asked for by taps not yet back in the state

  const allowed = (tool) => !!state && state.screen_tools.includes(tool);

  function miniRobot(color) {
    const icon = svg("svg", { class: "mini tinted", "aria-hidden": "true" });
    if (color) icon.style.setProperty("--glow", color);
    icon.append(svg("use", { href: "#mini-robot" }));
    return icon;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function changed(key, value) {
    const json = JSON.stringify(value);
    if (last[key] === json) return false;
    last[key] = json;
    return true;
  }

  function clock(seconds) {
    const s = Math.max(0, Math.round(seconds));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${r}` : `${m}:${r}`;
  }

  const SVGNS = robot.namespaceURI;
  function svg(tag, attrs) {
    const e = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }

  function drawLights(lights, canTap) {
    const box = $("lights");
    box.textContent = "";
    if (!lights.length) { box.append(el("div", "empty", "No lights")); return; }
    for (const l of lights) {
      const tile = el("button", "bulb" + (l.is_on ? " on" : ""));
      tile.disabled = !canTap;
      tile.addEventListener("click", () => post("/api/light", { room: l.room, is_on: !l.is_on }).catch(() => {}));
      const level = l.is_on ? Math.max(0.25, (l.brightness || 0) / 100) : 0;
      tile.style.setProperty("--level", level);
      const icon = svg("svg", { viewBox: "0 0 32 32", "aria-hidden": "true" });
      icon.append(
        svg("path", { class: "rays", d: "M16 1v3M4 6l2 2M28 6l-2 2M1 15h3M28 15h3" }),
        svg("path", { class: "glass", d: "M16 6a8 8 0 0 0-5 14.2V23h10v-2.8A8 8 0 0 0 16 6z", "fill-opacity": l.is_on ? 0.35 + 0.65 * level : 1 }),
        svg("rect", { class: "base", x: 11.5, y: 24, width: 9, height: 4, rx: 1.5 }),
      );
      tile.append(icon, el("b", "", l.room), el("span", "", l.is_on ? `${l.brightness}%` : "Off"));
      tile.setAttribute("aria-label", `${l.room} light ${l.is_on ? "on at " + l.brightness + " percent" : "off"}${canTap ? ", tap to turn " + (l.is_on ? "off" : "on") : ""}`);
      box.append(tile);
    }
  }

  function drawThermostat(t, canTap) {
    const c = Number(t.target_c);
    $("cooler").disabled = !canTap || !(c > 16);
    $("warmer").disabled = !canTap || !(c < 30);
    const share = Math.min(100, Math.max(0, ((c - 16) / 14) * 100));
    $("thermo-level").setAttribute("stroke-dasharray", `${share} 100`);
    $("temp").textContent = Number.isFinite(c) ? `${c % 1 ? c.toFixed(1) : c}°` : "--";
    $("mode").textContent = t.mode || "--";
    $("thermo").style.setProperty("--mode-color", MODE_COLORS[t.mode] || "var(--muted)");
    $("thermo").setAttribute("aria-label", `Thermostat set to ${c} degrees, ${t.mode}`);
  }

  function drawMusic(m, canTap) {
    const box = $("music");
    box.textContent = m.now_playing ? (m.playing ? m.now_playing : "Paused: " + m.now_playing) : "Nothing playing";
    box.classList.toggle("paused", !m.playing);
    const playing = m.playing && !!m.now_playing;
    $("play").querySelector("span").textContent = playing ? "Pause" : "Play";
    $("play").setAttribute("aria-label", playing ? "Pause music" : "Play music");
    $("play-icon").setAttribute("d", playing ? "M7 5h4v14H7zM13 5h4v14h-4z" : "M7 5l12 7-12 7z");
    $("play").disabled = !canTap;
    $("next").disabled = !canTap || !m.now_playing;
  }

  function drawTimers() {
    const box = $("timers");
    if (!timers.length) {
      if (box.dataset.n !== "0") { box.textContent = ""; box.append(el("div", "empty", "None set")); box.dataset.n = "0"; }
      return;
    }
    const now = Date.now() / 1000;
    const key = timers.map((t) => t.fires_at).join();
    if (box.dataset.key !== key) {   // rebuild only when the set of timers changes
      box.textContent = "";
      box.dataset.key = key;
      box.dataset.n = timers.length;
      for (const t of timers) {
        const row = el("div", "timer" + (t.kind === "alarm" ? " alarm" : ""));
        const ring = svg("svg", { viewBox: "0 0 40 40", "aria-hidden": "true" });
        ring.append(svg("circle", { class: "track", cx: 20, cy: 20, r: 16 }),
                    svg("circle", { class: "left", cx: 20, cy: 20, r: 16, "stroke-dasharray": RING }));
        const text = el("div");
        text.append(el("b", "", t.label || (t.kind === "alarm" ? "Alarm" : "Timer")), el("span"));
        row.append(ring, text);
        box.append(row);
      }
      if (state && state.timers_more) box.append(el("div", "empty", `and ${state.timers_more} more`));
    }
    box.querySelectorAll(".timer").forEach((row, i) => {
      const t = timers[i];
      const left = t.fires_at - now;
      let share = 1;
      if (t.kind === "alarm") {
        const at = new Date(t.fires_at * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        row.querySelector("span").textContent = `${at}, in ${clock(left)}`;
        if (t.created_at) share = left / (t.fires_at - t.created_at);
      } else {
        row.querySelector("span").textContent = `${clock(left)} left`;
        if (t.created_at) share = left / (t.fires_at - t.created_at);
      }
      share = Math.min(1, Math.max(0, share));
      row.querySelector(".left").setAttribute("stroke-dashoffset", RING * (1 - share));
    });
  }

  function drawHistory(entries) {
    const box = $("chat");
    const pinned = box.parentElement.scrollHeight - box.parentElement.scrollTop - box.parentElement.clientHeight < 40;
    box.textContent = "";
    if (!entries.length) box.append(el("div", "msg system", "Nothing said yet"));
    for (const e of entries) {
      const m = el("div", "msg " + e.who, e.text);
      if (e.who !== "system") m.prepend(el("span", "sr", e.who === "user" ? "You said: " : "Agent said: "));
      box.append(m);
    }
    if (pinned || !$("chat-box").hidden) box.parentElement.scrollTop = box.parentElement.scrollHeight;
  }

  function setAgent(a) {
    document.documentElement.style.setProperty("--glow", a.color);
    $("agent-name").textContent = a.name;
    $("agent-chip").setAttribute("aria-label", `Choose an agent. Now ${a.name}`);
  }

  function talking(on) {
    robot.classList.toggle("talking", on);
    // The mouth follows a made-up rhythm, not the audio: the page never receives audio.
    if (on && !talkTimer) talkTimer = setInterval(() => $("talk").setAttribute("ry", 10 + Math.random() * 34), 90);
    if (!on && talkTimer) { clearInterval(talkTimer); talkTimer = null; }
  }

  function draw(s) {
    state = s;
    robot.dataset.face = s.face;
    talking(s.talking);
    if (s.activity !== "idle" || s.talking) idleSince = Date.now();
    $("state").textContent = s.switching ? `Switching to ${s.switching}`
      : s.muted ? "Mic muted" : s.network_down ? "Connection lost" : s.voice_down ? "Voice is down" : LABELS[s.activity];
    $("step").textContent = s.step;
    $("heard").textContent = s.heard;
    $("said").textContent = s.said;
    if (changed("agent", s.agent)) setAgent(s.agent);
    const tools = s.screen_tools || [];
    if (changed("lights", [s.lights, tools.includes("set_light")])) drawLights(s.lights, tools.includes("set_light"));
    if (changed("thermostat", [s.thermostat, tools.includes("set_thermostat")])) drawThermostat(s.thermostat, tools.includes("set_thermostat"));
    if (changed("music", [s.music, tools.includes("stop_music")])) drawMusic(s.music, tools.includes("stop_music"));
    if (changed("timers", s.timers)) { timers = s.timers; drawTimers(); }
    if (s.spotify_player && !playerLoaded) {   // off by default, so the page stays self-contained
      playerLoaded = true;
      const script = document.createElement("script");
      script.src = "/spotify-player.js";
      document.head.append(script);
    }
    const mute = $("mute");
    mute.textContent = s.muted ? "Mic is muted" : "Mute mic";
    mute.setAttribute("aria-pressed", s.muted);
  }

  function connect() {
    const stream = new EventSource("/events");
    stream.onopen = () => { document.body.dataset.link = "on"; };
    stream.onmessage = (e) => { document.body.dataset.link = "on"; draw(JSON.parse(e.data)); };
    stream.addEventListener("history", (e) => drawHistory(JSON.parse(e.data)));
    stream.onerror = () => {   // EventSource reconnects by itself
      document.body.dataset.link = "off";
      robot.dataset.face = "sad";
      talking(false);
      $("state").textContent = "Agent not running";
      $("step").textContent = "";
    };
  }

  async function post(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    if (!r.ok) throw new Error((await r.text()) || `HTTP ${r.status}`);
    return r.json();
  }

  // Tabs
  for (const [tab, panel] of [["tab-home", "home"], ["tab-chat", "chat-box"]]) {
    $(tab).addEventListener("click", () => {
      for (const [t, p] of [["tab-home", "home"], ["tab-chat", "chat-box"]]) {
        $(t).setAttribute("aria-selected", t === tab);
        $(p).hidden = t !== tab;
      }
      if (panel === "chat-box") $("chat-box").scrollTop = $("chat-box").scrollHeight;
    });
  }

  // Music buttons: the bot runs the music tools through the tool policy.
  $("play").addEventListener("click", () => {
    const playing = state && state.music.playing && state.music.now_playing;
    post("/api/music", { action: playing ? "pause" : "play" }).catch(() => {});
  });
  $("next").addEventListener("click", () => post("/api/music", { action: "next" }).catch(() => {}));

  // Thermostat steps: the policy checks the range and the half-degree step again.
  function step(by) {
    if (!allowed("set_thermostat")) return;
    const from = pendingTarget ?? Number(state.thermostat.target_c);
    const to = Math.min(30, Math.max(16, Math.round((from + by) * 2) / 2));
    if (to === from) return;
    pendingTarget = to;
    post("/api/thermostat", { target_c: to }).catch(() => {}).finally(() => { if (pendingTarget === to) pendingTarget = null; });
  }
  $("cooler").addEventListener("click", () => step(-0.5));
  $("warmer").addEventListener("click", () => step(0.5));
  $("mute").addEventListener("click", () => fetch("/api/mute", { method: "POST" }));

  // Agent sheet
  function shortModel(id) {
    return (catalog.models[id] || id).split(",")[0];
  }

  // Each agent starts with the model picked under it; the pick is kept for its next session.
  async function start(a, model) {
    try { await post("/api/agents/active", { id: a.id, model }); $("sheet").close(); } catch (e) { alert(e.message); }
  }

  function drawAgents() {
    const list = $("agent-list");
    list.textContent = "";
    for (const a of catalog.agents) {
      const item = el("div", "agent-item");
      item.style.setProperty("--c", a.color);
      item.dataset.current = a.id === catalog.active;
      const b = el("button", "agent");
      b.setAttribute("aria-current", a.id === catalog.active);
      const pick = el("select");
      pick.setAttribute("aria-label", `Model for ${a.name}`);
      pick.append(Object.assign(el("option", "", `${shortModel(a.model)} (default)`), { value: "" }));
      for (const id of Object.keys(catalog.models)) {
        if (id !== a.model) pick.append(Object.assign(el("option", "", shortModel(id)), { value: id }));
      }
      pick.value = (catalog.picks || {})[a.id] || "";
      const kind = el("em");
      const note = el("p", "note", "Other models may handle the generalist's many tools less well.");
      const show = () => {
        kind.textContent = (a.kind === "generalist" ? "All tools" : "Documents only") + ", " + shortModel(pick.value || a.model);
        note.hidden = a.kind !== "generalist" || !pick.value;
      };
      show();
      pick.addEventListener("change", () => { show(); start(a, pick.value); });
      b.append(miniRobot(a.color), el("b", "", a.name), el("span", "", a.description || a.documents.join(", ")), kind);
      b.addEventListener("click", () => start(a, pick.value));
      const foot = el("div", "agent-row");
      foot.append(pick);
      if (!a.builtin) {
        const edit = el("button", "edit", "Edit");
        edit.setAttribute("aria-label", `Edit ${a.name}`);
        edit.addEventListener("click", () => openForm(a));
        foot.append(edit);
      }
      item.append(b, foot, note);
      list.append(item);
    }
  }

  function openForm(agent) {
    editing = agent;
    const f = $("builder");
    f.reset();
    $("form-error").textContent = "";
    $("sheet-title").textContent = agent ? `Edit ${agent.name}` : "New agent";
    $("agent-list").hidden = true;
    $("new-agent").hidden = true;
    f.hidden = false;
    $("delete-agent").hidden = !agent;
    const model = $("model");
    model.textContent = "";
    for (const [id, label] of Object.entries(catalog.models)) model.append(Object.assign(el("option", "", label), { value: id }));
    model.value = agent ? agent.model : "anthropic/claude-haiku-5.5";
    const colors = $("colors");
    colors.textContent = "";
    const pick = agent ? agent.color : Object.keys(catalog.colors)[3];
    for (const [hex, name] of Object.entries(catalog.colors)) {
      const label = el("label");
      const input = Object.assign(document.createElement("input"), { type: "radio", name: "color", value: hex, checked: hex === pick });
      input.setAttribute("aria-label", name);
      const dot = el("span");
      dot.append(miniRobot(hex));
      label.append(input, dot);
      colors.append(label);
    }
    const docs = $("docs");
    docs.textContent = "";
    if (!catalog.documents.length) docs.append(el("div", "empty", "Put files in data/documents first"));
    for (const d of catalog.documents) {
      const label = el("label");
      const input = Object.assign(document.createElement("input"), { type: "checkbox", name: "documents", value: d });
      input.checked = !!agent && agent.documents.some((x) => x === d.replace(/\/$/, ""));
      label.append(input, document.createTextNode(d.endsWith("/") ? `${d} (folder)` : d));
      docs.append(label);
    }
    f.elements.name.value = agent ? agent.name : "";
    f.elements.description.value = agent ? agent.description : "";
    f.elements.name.focus();
  }

  function showList() {
    $("builder").hidden = true;
    $("agent-list").hidden = false;
    $("new-agent").hidden = false;
    $("sheet-title").textContent = "Choose an agent";
  }

  async function openSheet() {
    try {
      const r = await fetch("/api/agents");
      if (!r.ok) throw new Error(await r.text());
      catalog = await r.json();
    } catch (e) { alert("Agents are not available: " + e.message); return; }
    drawAgents();
    showList();
    $("sheet").showModal();
  }

  $("agent-chip").addEventListener("click", openSheet);
  $("close-sheet").addEventListener("click", () => $("sheet").close());
  $("new-agent").addEventListener("click", () => openForm(null));
  $("cancel-form").addEventListener("click", showList);
  $("delete-agent").addEventListener("click", async () => {
    if (!editing || !confirm(`Delete ${editing.name}? Its documents stay where they are.`)) return;
    try { await post("/api/agents/delete", { id: editing.id }); await openSheet(); } catch (e) { $("form-error").textContent = e.message; }
  });
  $("builder").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const body = {
      id: editing ? editing.id : undefined,
      name: f.elements.name.value.trim(),
      description: f.elements.description.value.trim(),
      model: f.elements.model.value,
      color: (f.querySelector('input[name="color"]:checked') || {}).value,
      documents: [...f.querySelectorAll('input[name="documents"]:checked')].map((i) => i.value),
    };
    try {
      await post("/api/agents/save", body);
      catalog = await (await fetch("/api/agents")).json();
      drawAgents();
      showList();
    } catch (e) { $("form-error").textContent = e.message; }
  });

  (function blink() {
    setTimeout(() => {
      robot.classList.add("blink");
      setTimeout(() => { robot.classList.remove("blink"); blink(); }, 130);
    }, 2500 + Math.random() * 3500);
  })();

  // One tick a second: timer text and rings, and resting the idle motion after a minute.
  setInterval(() => {
    if (timers.length) drawTimers();
    document.body.classList.toggle("rest", Date.now() - idleSince > REST_AFTER_MS);
  }, 1000);
  connect();
</script>
</body>
</html>
