[project]
name = "me3"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastmcp>=4.1,<5",
    "mcp>=2,<3",
    "pipecat-ai[anthropic,cartesia,deepgram,groq,local,mcp,silero]==1.13.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]
