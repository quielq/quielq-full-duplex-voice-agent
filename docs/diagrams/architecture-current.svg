<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" font-family="Helvetica, Arial, sans-serif">
  <title>Via system diagram: Raspberry Pi 5 and cloud APIs, Nov 6, 2026</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5a75"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8792b"/>
    </marker>
    <style>
      .zone { stroke-width: 2; rx: 14; }
      .box { fill: #ffffff; stroke: #9aa8bd; stroke-width: 1.5; rx: 8; }
      .mcp { fill: #fff7ef; stroke: #e8792b; stroke-width: 2; rx: 8; }
      .cloud { fill: #ffffff; stroke: #1f8a8a; stroke-width: 1.5; rx: 8; }
      .t { font-size: 15px; font-weight: 700; fill: #1b2a44; }
      .s { font-size: 12px; fill: #4a5a75; }
      .zl { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .el { font-size: 11px; fill: #4a5a75; }
      .ol { font-size: 11.5px; font-weight: 700; fill: #c95f17; }
      .ln { stroke: #4a5a75; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .bi { stroke: #e8792b; stroke-width: 2; stroke-dasharray: 6 4; fill: none; marker-end: url(#o); }
    </style>
  </defs>

  <!-- Zones -->
  <rect class="zone" x="10" y="10" width="890" height="540" fill="#eef2f7" stroke="#1b2a44"/>
  <text class="zl" x="28" y="36" fill="#1b2a44">RASPBERRY PI 5 · ON DEVICE · ONE HARNESS PROCESS + OUR MCP SERVERS</text>
  <rect class="zone" x="920" y="10" width="370" height="540" fill="#eaf5f5" stroke="#1f8a8a"/>
  <text class="zl" x="938" y="36" fill="#1f8a8a">CLOUD APIs · EACH BEHIND A DAILY CAP</text>

  <!-- Row 1: audio in -->
  <rect class="box" x="30" y="60" width="140" height="64"/>
  <text class="t" x="44" y="86">USB mic</text>
  <text class="s" x="44" y="106">16 kHz mono</text>

  <rect class="box" x="200" y="60" width="150" height="64"/>
  <text class="t" x="214" y="86">WebRTC AEC</text>
  <text class="s" x="214" y="106">speaker as reference</text>

  <rect class="box" x="380" y="60" width="150" height="64"/>
  <text class="t" x="394" y="86">Silero VAD</text>
  <text class="s" x="394" y="106">local, speech start/stop</text>

  <rect class="mcp" x="680" y="60" width="200" height="64"/>
  <text class="t" x="694" y="86">voice-listen MCP</text>
  <text class="s" x="694" y="106">ASR server, holds Flux key</text>

  <path class="ln" d="M170 92 H198"/>
  <path class="ln" d="M350 92 H378"/>
  <path class="ln" d="M530 92 H678"/>
  <text class="el" x="560" y="84">audio, Unix socket</text>

  <!-- Row 2: harness -->
  <rect x="22" y="168" width="866" height="96" rx="10" fill="none" stroke="#1b2a44" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="el" x="30" y="282" font-weight="700" fill="#1b2a44">Pipecat 1.13 harness, the MCP client (dashed)</text>
  <rect class="box" x="30" y="184" width="170" height="64"/>
  <text class="t" x="44" y="210">Turn end + context</text>
  <text class="s" x="44" y="230">Flux end of turn, eager 0.5</text>

  <rect class="box" x="230" y="184" width="150" height="64"/>
  <text class="t" x="244" y="210">ContextWindow</text>
  <text class="s" x="244" y="230">last 20 user turns</text>

  <rect class="box" x="440" y="184" width="200" height="64"/>
  <text class="t" x="454" y="210">LLM client</text>
  <text class="s" x="454" y="230">streams tokens, Via prompt v1</text>

  <path class="ln" d="M780 124 V150 H115 V182"/>
  <text class="el" x="560" y="146">transcripts, end of turn</text>
  <path class="ln" d="M200 216 H228"/>
  <path class="ln" d="M380 216 H438"/>

  <!-- Row 3: tools and screen -->
  <rect class="box" x="30" y="310" width="180" height="64"/>
  <text class="t" x="44" y="336">Robot face</text>
  <text class="s" x="44" y="356">7-inch touch, 127.0.0.1</text>

  <rect class="box" x="440" y="310" width="150" height="64"/>
  <text class="t" x="454" y="336">ToolPolicy</text>
  <text class="s" x="454" y="356">undo, read-back, yes</text>

  <rect class="mcp" x="680" y="310" width="200" height="64"/>
  <text class="t" x="694" y="336">10 task MCP servers</text>
  <text class="s" x="694" y="356">clock, notes, lights, web, files…</text>

  <path class="ln" d="M515 250 V308" marker-start="url(#a)"/>
  <text class="el" x="522" y="285">tool calls</text>
  <path class="ln" d="M590 342 H678" marker-start="url(#a)"/>
  <text class="el" x="597" y="330">stdio / HTTP</text>
  <path class="ln" d="M210 342 H438"/>
  <text class="el" x="250" y="334">taps checked by policy</text>

  <!-- Row 4: audio out -->
  <rect class="box" x="230" y="440" width="150" height="64"/>
  <text class="t" x="244" y="466">USB speaker</text>
  <text class="s" x="244" y="486">24 kHz</text>

  <rect class="box" x="440" y="440" width="200" height="64"/>
  <text class="t" x="454" y="466">Playback</text>
  <text class="s" x="454" y="486">ducking, heard-words commit</text>

  <rect class="mcp" x="680" y="440" width="200" height="64"/>
  <text class="t" x="694" y="466">voice-speak MCP</text>
  <text class="s" x="694" y="486">TTS server, holds Cartesia key</text>

  <path class="ln" d="M640 240 H664 V420 H780 V438"/>
  <text class="el" x="672" y="414">reply text, sentence by sentence</text>
  <path class="ln" d="M680 472 H642"/>
  <path class="ln" d="M440 472 H382"/>

  <!-- Barge-in -->
  <path class="bi" d="M500 124 V182"/>
  <path class="bi" d="M410 124 V400 H470 V438"/>
  <text class="ol" x="30" y="530">Barge-in (orange): speech start → stop playback + cancel LLM stream → listen. Context keeps only the words heard.</text>

  <!-- Cloud -->
  <rect class="cloud" x="940" y="60" width="330" height="64"/>
  <text class="t" x="954" y="86">Deepgram Flux</text>
  <text class="s" x="954" y="106">streaming ASR with its own end of turn</text>

  <rect class="cloud" x="940" y="184" width="330" height="64"/>
  <text class="t" x="954" y="210">Claude Haiku 5.5 (Anthropic)</text>
  <text class="s" x="954" y="230">LLM, tool calling, prompt caching</text>

  <rect class="cloud" x="940" y="440" width="330" height="64"/>
  <text class="t" x="954" y="466">Cartesia Sonic 3.6</text>
  <text class="s" x="954" y="486">streaming TTS with word timestamps</text>

  <text class="el" x="944" y="330">Open-Meteo, web fetch and search are</text>
  <text class="el" x="944" y="346">called by the task servers, not the LLM.</text>

  <path class="ln" d="M880 92 H938" marker-start="url(#a)"/>
  <path class="ln" d="M640 216 H938" marker-start="url(#a)"/>
  <path class="ln" d="M880 472 H938" marker-start="url(#a)"/>
  <text class="el" x="700" y="208">WebSocket / HTTPS</text>
</svg>
